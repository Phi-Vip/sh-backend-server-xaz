; ==============================================================================
; CẤU HÌNH SUPERVISOR QUẢN TRỊ CỤM MULTI-WORKER VOICE CORE (TASK 4.1)
; Tự động khởi động lại khi crash, phân bổ worker_id và port độc lập
; ==============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:voice_worker]
command=python app.py
directory=/opt/xiaozhi-esp32-server/main/xiaozhi-server
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
environment=WS_PORT="800%(process_num)1d",HTTP_PORT="801%(process_num)1d",WORKER_ID="worker_%(process_num)02d",PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/voice_worker_%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/voice_worker_%(process_num)02d.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
