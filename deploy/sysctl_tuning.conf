# ==============================================================================
# CẤU HÌNH TỐI ƯU NHÂN LINUX MÁY CHỦ CỤM VOICE WORKERS (TASK 4.1)
# Áp dụng cho máy chủ chịu tải cao 1.000+ kết nối WebSocket đồng thời
# ==============================================================================

# Giới hạn số file descriptor mở đồng thời trên toàn hệ thống
fs.file-max = 2097152

# Kích thước hàng đợi kết nối TCP chờ chấp nhận (backlog)
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192

# Tái sử dụng socket ở trạng thái TIME_WAIT cho kết nối mới (chống cạn kiệt port)
net.ipv4.tcp_tw_reuse = 1

# Rút ngắn thời gian chờ TIME_WAIT
net.ipv4.tcp_fin_timeout = 15

# Mở rộng dải cổng cục bộ cho các kết nối outbound / proxy
net.ipv4.ip_local_port_range = 1024 65535

# Tối ưu bộ đệm TCP cho luồng âm thanh truyền tải liên tục
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
