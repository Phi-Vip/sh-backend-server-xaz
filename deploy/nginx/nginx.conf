# ==============================================================================
# CẤU HÌNH NGINX INGRESS LOAD BALANCER & BẢO MẬT BIÊN (GIAI ĐOẠN 4)
# Thuật toán: least_conn phân phối tải đều cho Cụm Voice Core Multi-Worker
# Bảo mật: Phòng chống lỗ hổng tràn bộ đệm Heap RCE (CVE-2026-123007)
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip nén dữ liệu cho web portal
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # KHAI BÁO CỤM UPSTREAM STATELESS WORKERS (TASK 4.1)
    # Thuật toán least_conn: kết nối mới được chuyển đến worker đang có ít tải nhất
    # --------------------------------------------------------------------------
    upstream voice_cluster {
        least_conn;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Upstream cho Quản lý cấu hình & Hub MCP (Port 8005)
    upstream manager_api {
        server 127.0.0.1:8005 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream cho Web Portal tĩnh (Port 8002)
    upstream web_portal {
        server 127.0.0.1:8002;
    }

    # --------------------------------------------------------------------------
    # CHỐNG LẠM DỤNG & RATE LIMITING (TASK 4.2 & TASK 2.5)
    # --------------------------------------------------------------------------
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;
    # Giới hạn OTA 1 request/giây trên mỗi IP, burst=2 (chống spam từ firmware cũ / brute-force mã PIN)
    limit_req_zone $binary_remote_addr zone=ota_req_limit:10m rate=1r/s;
    # Giới hạn API Quản trị 20 requests/giây
    limit_req_zone $binary_remote_addr zone=api_req_limit:10m rate=20r/s;

    # --------------------------------------------------------------------------
    # CỔNG HTTP: TỰ ĐỘNG CHUYỂN HƯỚNG SANG HTTPS (PORT 80 -> 443)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # CỔNG CHÍNH HTTPS & WSS (PORT 443)
    # GIA CỐ BẢO MẬT BIÊN (SERVER HARDENING - CHỐNG CVE-2026-123007):
    # Tuyệt đối KHÔNG BẬT MODULE HTTP/2. Toàn bộ luồng ESP32 (WSS, OTA, Vision)
    # và Web API chạy thuần HTTP/1.1 + TLS 1.3 để triệt tiêu 100% rủi ro Heap RCE.
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name localhost;

        # Chứng chỉ bảo mật TLS (Let's Encrypt hoặc Enterprise CA)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Giới hạn kết nối đồng thời từ 1 IP
        limit_conn addr_conn_limit 50;

        # Xử lý phản hồi Rate-Limit HTTP 429 chuẩn kèm Retry-After (Task 2.5 & 4.2)
        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header Retry-After 5 always;
            add_header Content-Type application/json always;
            return 429 '{"code":10429,"msg":"Too Many Requests - Vui lòng thử lại sau 5 giây"}';
        }

        # 1. CỔNG KẾT NỐI WEBSOCKET VOICE CORE (wss://<domain>/xiaozhi/v1/)
        location /xiaozhi/v1/ {
            proxy_pass http://voice_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tự động dọn kết nối zombie: timeout 300s kết hợp ping 30s
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # 2. CỔNG OTA & KÍCH HOẠT LOA (/xiaozhi/ota/)
        # Áp dụng Rate-Limit 1r/s burst=2 nodelay trả 429 + Retry-After chống spam (Task 2.5)
        location /xiaozhi/ota/ {
            limit_req zone=ota_req_limit burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://voice_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # 3. CỔNG PHÂN TÍCH HÌNH ẢNH THỊ GIÁC (/mcp/vision/)
        location /mcp/vision/ {
            proxy_pass http://voice_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 4. CỔNG API QUẢN TRỊ & CẤU HÌNH AGENT (/config/, /api/v1/)
        location ~ ^/(config|api/v1)/ {
            limit_req zone=api_req_limit burst=10 nodelay;
            proxy_pass http://manager_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. ENDPOINT KIỂM TRA SỨC KHỎE CỤM (/healthz)
        location /healthz {
            proxy_pass http://voice_cluster/healthz;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # 6. GIAO DIỆN WEB PORTAL QUẢN TRỊ TĨNH
        location / {
            proxy_pass http://web_portal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
