  <text x="515" y="385" fill="#581c87" font-size="11.5" font-weight="600">• Đo lường độ trễ RTT: VAD -> STT -> LLM -> TTS -> Loa (ms)</text>
  <text x="515" y="408" fill="#581c87" font-size="11.5" font-weight="600">• Giám sát tải CPU, RAM, nhiệt độ máy chủ và dung lượng CSDL</text>
