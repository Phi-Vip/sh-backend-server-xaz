  <text x="515" y="454" fill="#581c87" font-size="11.5" font-weight="600">• Tối ưu Prompt Caching Hit Rate (mục tiêu đạt trên 85%)</text>
  <text x="515" y="477" fill="#581c87" font-size="11.5" font-weight="600">• Nhật ký cuộc gọi và phân tích lỗi thoại (Error Tracing &amp; Fallback)</text>
