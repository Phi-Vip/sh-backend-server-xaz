  <line x1="320" y1="760" x2="726" y2="760" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="740,760 726,754 726,766" fill="#16a34a"/>

  <!-- ----- PHASE 4 MESSAGES ----- -->
  <!-- Msg 13: ESP (110) -> Server (320) -->
  <line x1="110" y1="870" x2="306" y2="870" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="320,870 306,864 306,876" fill="#2563eb"/>

  <!-- Msg 14: Server (320) -> CSDL (530) -->
  <line x1="320" y1="905" x2="516" y2="905" stroke="#059669" stroke-width="2.5"/>
  <polygon points="530,905 516,899 516,911" fill="#059669"/>

  <!-- Msg 15: Server (320) -> ESP (110) [Dashed Return Success] -->
  <line x1="320" y1="940" x2="124" y2="940" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="110,940 124,934 124,946" fill="#16a34a"/>

