  <text x="530" y="69" text-anchor="middle" fill="#475569" font-size="12.5">Cơ chế bảo mật Zero-Touch Provisioning &amp; Active Polling hai chiều (ESP32-S3 &amp; Web Console)</text>

  <!-- 1. Loa ESP32-S3 (Center X=110) -->
  <rect x="30" y="98" width="160" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
