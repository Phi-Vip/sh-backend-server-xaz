  <rect x="770" y="635" width="160" height="20" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="850" y="649" text-anchor="middle" fill="#5b21b6" font-size="10.5" font-weight="600">9. Nhập 6 ô OTP: "839201"</text>

  <rect x="470" y="670" width="200" height="20" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="570" y="684" text-anchor="middle" fill="#1e3a8a" font-size="10.5" font-weight="600">10. POST /claim-pin (PIN: 839201)</text>

  <rect x="345" y="705" width="160" height="20" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="425" y="719" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="600">11. Gán user_id &amp; Xóa Session</text>

  <rect x="470" y="740" width="200" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="570" y="754" text-anchor="middle" fill="#15803d" font-size="10.5" font-weight="700">12. HTTP 200 OK -&gt; Toast "Thành công!"</text>

  <!-- Phase 4 Labels -->
  <rect x="135" y="850" width="160" height="20" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="215" y="864" text-anchor="middle" fill="#1e3a8a" font-size="10.5" font-weight="600">13. POST /ota/activate (Poll)</text>

  <rect x="345" y="885" width="160" height="20" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="425" y="899" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="600">14. get_speaker(MAC) -&gt; ĐÃ CÓ USER!</text>

  <rect x="125" y="920" width="180" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="215" y="934" text-anchor="middle" fill="#15803d" font-size="10.5" font-weight="700">15. HTTP 200 OK ("success") &lt; 30ms</text>


