  <text x="425" y="499" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="600">7. Kiểm tra DB -&gt; Chưa có User</text>

  <rect x="135" y="520" width="160" height="20" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
