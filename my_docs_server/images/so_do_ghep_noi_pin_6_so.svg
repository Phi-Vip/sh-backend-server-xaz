  <text x="725" y="528" fill="#64748b" font-size="10.5">• Phản hồi HTTP 202 trong &lt; 20ms</text>
  <text x="725" y="548" fill="#64748b" font-size="10.5">• Session OTP còn hiệu lực 300 giây</text>

  <!-- ----- PHASE 3 MESSAGES ----- -->
  <!-- Msg 9: User (950) -> Web Portal (740) -->
  <line x1="950" y1="655" x2="754" y2="655" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="740,655 754,649 754,661" fill="#7c3aed"/>

