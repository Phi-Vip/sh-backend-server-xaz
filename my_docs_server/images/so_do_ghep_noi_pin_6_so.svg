  <text x="738" y="1096" fill="#5b21b6" font-size="11.5" font-weight="600">Người dùng / Web</text>

  <line x1="875" y1="1092" x2="910" y2="1092" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4"/>
