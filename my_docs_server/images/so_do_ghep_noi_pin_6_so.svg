<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1190" width="1060" height="1190" style="background:#ffffff; font-family:'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif;">

  <!-- ==================== LAYER 1: BACKGROUND PHASE CARDS ==================== -->
  <!-- Phase 1 Background -->
  <rect x="25" y="170" width="1010" height="185" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="38" y="178" width="310" height="26" rx="5" fill="#2563eb"/>
  <text x="48" y="196" fill="#ffffff" font-size="11.5" font-weight="700">GIAI ĐOẠN 1: KHỞI ĐỘNG &amp; YÊU CẦU KÍCH HOẠT</text>

  <!-- Phase 2 Background -->
  <rect x="25" y="375" width="1010" height="205" rx="8" fill="#f8fafc" stroke="#fde047" stroke-width="2"/>
  <rect x="38" y="383" width="335" height="26" rx="5" fill="#d97706"/>
  <text x="48" y="401" fill="#ffffff" font-size="11.5" font-weight="700">GIAI ĐOẠN 2: TRÌNH DIỄN MÃ PIN &amp; ACTIVE POLLING</text>

  <!-- Phase 3 Background -->
  <rect x="25" y="600" width="1010" height="195" rx="8" fill="#f8fafc" stroke="#86efac" stroke-width="2"/>
  <rect x="38" y="608" width="355" height="26" rx="5" fill="#16a34a"/>
  <text x="48" y="626" fill="#ffffff" font-size="11.5" font-weight="700">GIAI ĐOẠN 3: NGƯỜI DÙNG NHẬP MÃ TRÊN WEB PORTAL</text>

  <!-- Phase 4 Background -->
  <rect x="25" y="815" width="1010" height="235" rx="8" fill="#f8fafc" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="38" y="823" width="385" height="26" rx="5" fill="#7c3aed"/>
  <text x="48" y="841" fill="#ffffff" font-size="11.5" font-weight="700">GIAI ĐOẠN 4: HOÀN TẤT KÍCH HOẠT &amp; BẮT ĐẦU ĐÀM THOẠI AI</text>


  <!-- ==================== LAYER 2: 5 VERTICAL LIFELINES (DRAWN ON TOP OF PHASE RECTS) ==================== -->
  <!-- Crisp, clearly visible dark slate lines with distinct dashes -->
  <line x1="110" y1="150" x2="110" y2="1050" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="320" y1="150" x2="320" y2="1050" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="530" y1="150" x2="530" y2="1050" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="740" y1="150" x2="740" y2="1050" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="950" y1="150" x2="950" y2="1050" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>


  <!-- ==================== LAYER 3: MESSAGE LINES & EXPLICIT POLYGON ARROWS ==================== -->
  
  <!-- ----- PHASE 1 MESSAGES ----- -->
  <!-- Msg 1: ESP (110) -> Server (320) -->
  <line x1="110" y1="230" x2="306" y2="230" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="320,230 306,224 306,236" fill="#2563eb"/>

  <!-- Msg 2: Server (320) -> CSDL (530) -->
  <line x1="320" y1="265" x2="516" y2="265" stroke="#059669" stroke-width="2.5"/>
  <polygon points="530,265 516,259 516,271" fill="#059669"/>

  <!-- Msg 3: Server (320) -> CSDL (530) -->
  <line x1="320" y1="300" x2="516" y2="300" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="530,300 516,294 516,306" fill="#d97706"/>

  <!-- Msg 4: Server (320) -> ESP (110) [Dashed Return] -->
  <line x1="320" y1="335" x2="124" y2="335" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="110,335 124,329 124,341" fill="#2563eb"/>

  <!-- Phase 1 Right Info Card -->
  <rect x="710" y="220" width="260" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="840" y="244" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">TRẠNG THÁI GIAI ĐOẠN 1:</text>
  <text x="725" y="268" fill="#64748b" font-size="10.5">• Thiết bị ESP32 vừa cắm nguồn</text>
  <text x="725" y="288" fill="#64748b" font-size="10.5">• Bắt Wi-Fi &amp; tự động xin mã kích hoạt</text>
  <text x="725" y="308" fill="#64748b" font-size="10.5">• Server tạo OTP và khởi tạo phiên</text>

  <!-- ----- PHASE 2 MESSAGES ----- -->
  <!-- Action 5: ESP32 Displays & Speaks -->
  <rect x="35" y="418" width="220" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="145" y="434" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="700">5. OLED: "839201" &amp; Loa đọc số</text>

  <rect x="850" y="418" width="170" height="24" rx="4" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="935" y="434" text-anchor="middle" fill="#6b21a8" font-size="10.5" font-weight="600">Khách nhìn thấy / nghe mã</text>

  <!-- Msg 6: ESP (110) -> Server (320) -->
  <line x1="110" y1="470" x2="306" y2="470" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="320,470 306,464 306,476" fill="#dc2626"/>

