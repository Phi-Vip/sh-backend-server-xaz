  <text x="290" y="296" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">3. CỤM VOICE WORKERS KHÔNG TRẠNG THÁI (STATELESS - 8001 ĐẾN 8004)</text>
  
  <!-- 4 Workers mini boxes -->
  <rect x="35" y="318" width="115" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
