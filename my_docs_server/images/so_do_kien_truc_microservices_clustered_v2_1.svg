  <rect x="600" y="540" width="540" height="225" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="600" y="540" width="540" height="32" rx="8" fill="url(#gradEmerald)"/>
  <text x="870" y="561" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">5. TẦNG DỮ LIỆU &amp; CACHE TẬP TRUNG (ZERO-LOCK PERSISTENCE)</text>

  <!-- Storage Cards -->
  <rect x="615" y="585" width="245" height="165" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="737" y="608" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">PostgreSQL 16 + PgBouncer</text>
  <text x="630" y="630" fill="#e2e8f0" font-size="10.5">• PgBouncer pool_mode = transaction</text>
  <text x="630" y="650" fill="#e2e8f0" font-size="10.5">• max_client_conn = 1000 | pool = 50</text>
  <text x="630" y="670" fill="#e2e8f0" font-size="10.5">• Thay thế SQLite smarthome.db</text>
  <text x="630" y="690" fill="#e2e8f0" font-size="10.5">• Users, Speakers, Agent Profiles</text>
  <text x="630" y="710" fill="#e2e8f0" font-size="10.5">• TokenVault giải mã chuẩn 100%</text>
  <text x="630" y="732" fill="#34d399" font-size="10" font-weight="700">✓ Triệt tiêu Tử huyệt 1 Database Locked</text>

  <rect x="880" y="585" width="245" height="165" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="1002" y="608" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">Redis 7 Cluster / Replica (AOF+RDB)</text>
  <text x="895" y="630" fill="#e2e8f0" font-size="10.5">• mem_redis: Hash theo user:device</text>
  <text x="895" y="650" fill="#e2e8f0" font-size="10.5">• In-Memory Cache Agent (TTL 120s)</text>
  <text x="895" y="670" fill="#e2e8f0" font-size="10.5">• Pub/Sub: xiaozhi:control:revoke</text>
  <text x="895" y="690" fill="#e2e8f0" font-size="10.5">• Khóa 3A: lock:tuya_refresh:{user}</text>
  <text x="895" y="710" fill="#e2e8f0" font-size="10.5">• mốc revoked_before chặn reconnect</text>
  <text x="895" y="732" fill="#f87171" font-size="10" font-weight="700">✓ Triệt tiêu Tử huyệt 2 Hỏng file YAML</text>

  <!-- Arrow Workers <-> Redis -->
  <path d="M 480 520 L 480 535 L 900 535 L 900 580" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="900,585 895,575 905,575" fill="#38bdf8"/>
