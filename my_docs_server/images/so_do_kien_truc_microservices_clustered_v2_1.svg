  <rect x="615" y="318" width="510" height="58" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="630" y="338" fill="#c084fc" font-size="11.5" font-weight="700">Manager API &amp; OTA Auth Core (FastAPI - Port 8000)</text>
  <text x="630" y="358" fill="#94a3b8" font-size="10.5">Cấp mã PIN 6 số, cấp AuthToken AES-GCM (1A), Deep-merge config_loader.py, Publish Revoke</text>

  <!-- Card 5.2: MCP SmartHome Hub -->
  <rect x="615" y="385" width="510" height="65" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="630" y="405" fill="#38bdf8" font-size="11.5" font-weight="700">MCP SmartHome Hub (Độc lập - Port 8005) [85% Chuẩn Thương Mại]</text>
  <text x="630" y="425" fill="#e2e8f0" font-size="10.5">• Khóa phân tán Tuya (3A): SET NX PX 30s + Double-Check DB + Lua Unlock (Không rớt Token)</text>
  <text x="630" y="442" fill="#94a3b8" font-size="10">• TokenVault AES-256-GCM, băm UID SHA-256 (NĐ 356/2025/NĐ-CP), JSON-RPC MCP Tools</text>

  <!-- Card 5.3: MCP Sunhouse RAG -->
  <rect x="615" y="458" width="510" height="52" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="630" y="478" fill="#fbbf24" font-size="11.5" font-weight="700">MCP Sunhouse RAG (Độc lập - Port 8006)</text>
  <text x="630" y="498" fill="#94a3b8" font-size="10.5">Truy vấn tri thức sản phẩm, bảo hành, HDSD Sunhouse | Giữ nguyên 100% không đổi mã nguồn</text>

