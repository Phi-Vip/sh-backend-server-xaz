  <text x="190" y="126" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">1. ĐỘI THIẾT BỊ THƯƠNG MẠI (1.000+ LOA)</text>
  <rect x="30" y="145" width="95" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
