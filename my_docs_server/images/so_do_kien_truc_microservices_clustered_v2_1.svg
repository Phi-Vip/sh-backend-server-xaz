  <!-- ================= ROW 4: BOTTOM QUALITY GATES BAR ================= -->
  <rect x="20" y="780" width="1120" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
  <text x="580" y="803" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="700">BỘ 7 TIÊU CHUẨN NGHIỆM THU THƯƠNG MẠI (COMMERCIAL QUALITY GATES - EXIT CRITERIA)</text>
  
  <rect x="35" y="815" width="145" height="35" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="107" y="830" text-anchor="middle" fill="#60a5fa" font-size="9.5" font-weight="700">QG-01: Chịu tải 1000 loa</text>
  <text x="107" y="843" text-anchor="middle" fill="#94a3b8" font-size="8.5">24h Soak Test &lt; 0.1% rớt</text>

  <rect x="193" y="815" width="145" height="35" rx="5" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
  <text x="265" y="830" text-anchor="middle" fill="#22d3ee" font-size="9.5" font-weight="700">QG-02: Độ trễ P95</text>
  <text x="265" y="843" text-anchor="middle" fill="#94a3b8" font-size="8.5">150 loa nói &lt;= 1.8s</text>

  <rect x="351" y="815" width="145" height="35" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="423" y="830" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="700">QG-03: Cô lập Tenant</text>
  <text x="423" y="843" text-anchor="middle" fill="#94a3b8" font-size="8.5">Không chéo bộ nhớ / DP</text>

  <rect x="509" y="815" width="145" height="35" rx="5" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
