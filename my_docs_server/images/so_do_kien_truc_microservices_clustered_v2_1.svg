  <!-- Compute Cards -->
  <rect x="35" y="585" width="505" height="48" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
  <text x="50" y="605" fill="#fda4af" font-size="11" font-weight="700">Cụm ASR Streaming Tách Rời (FunASRServer GPU / Cloud Streaming ASR)</text>
  <text x="50" y="622" fill="#94a3b8" font-size="10">Giải phóng CPU khỏi FunASR local, độ trễ &lt; 400ms, tối ưu SileroVAD giảm 30% băng thông</text>

  <rect x="35" y="642" width="505" height="48" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
  <text x="50" y="662" fill="#fda4af" font-size="11" font-weight="700">Cụm TTS Streaming Tách Rời (GPU VieneuTTS Pool / Cloud TTS Concurrency &gt;= 200)</text>
  <text x="50" y="679" fill="#94a3b8" font-size="10">Chấm dứt nghẽn GIL/CPU do Vieneu/Piper chạy trong Voice Worker, TTS Keep-Warm duy trì</text>

  <rect x="35" y="699" width="505" height="52" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
  <text x="50" y="719" fill="#fda4af" font-size="11" font-weight="700">LLM Key Pool &amp; AI Gateway (LiteLLM Proxy - 3 đến 5 API Keys)</text>
  <text x="50" y="738" fill="#94a3b8" font-size="10">Xoay vòng Round-Robin + Circuit Breaker: Tự động cách ly Key bị 429 Too Many Requests trong 60s</text>

  <!-- Arrow Voice Workers -> Compute -->
  <line x1="290" y1="520" x2="290" y2="534" stroke="#f43f5e" stroke-width="2.5"/>
  <polygon points="290,538 285,528 295,528" fill="#f43f5e"/>
  <text x="340" y="532" fill="#f43f5e" font-size="8.5" font-weight="700">Streams &amp; Inference</text>

