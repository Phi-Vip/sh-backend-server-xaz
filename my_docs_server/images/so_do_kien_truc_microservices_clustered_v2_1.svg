  <text x="302" y="210" text-anchor="middle" fill="#eab308" font-size="9.5">TTL 5 phút</text>

  <!-- Box 2: Ingress Gateway -->
  <rect x="410" y="105" width="340" height="135" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="410" y="105" width="340" height="32" rx="8" fill="url(#gradCyan)"/>
  <text x="580" y="126" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">2. CỬA NGÕ INGRESS TLS 1.3 (PORT 443)</text>
  <text x="425" y="160" fill="#e2e8f0" font-size="11.5" font-weight="600">• Cân bằng tải: Nginx least_conn thuật toán</text>
  <text x="425" y="182" fill="#e2e8f0" font-size="11.5" font-weight="600">• Bảo vệ 2C: limit_req /xiaozhi/ota/ + Retry-After</text>
  <text x="425" y="204" fill="#e2e8f0" font-size="11.5" font-weight="600">• Chống Zombie: Ping 30s | proxy_read_timeout 300s</text>
  <text x="425" y="226" fill="#38bdf8" font-size="11" font-weight="700">• Định tuyến WSS 443 sang cụm Workers 8001–8004</text>

  <!-- Box 3: Web Portal & Mobile App -->
  <rect x="800" y="105" width="340" height="135" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="800" y="105" width="340" height="32" rx="8" fill="url(#gradAmber)"/>
  <text x="970" y="126" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">GIAO DIỆN NGƯỜI DÙNG &amp; QUẢN TRỊ</text>
  <text x="815" y="160" fill="#e2e8f0" font-size="11.5" font-weight="600">• Web Console Portal / eSunhouse App</text>
  <text x="815" y="182" fill="#e2e8f0" font-size="11.5" font-weight="600">• Nhập mã PIN 6 số ghép nối loa (TTL 5m)</text>
  <text x="815" y="204" fill="#e2e8f0" font-size="11.5" font-weight="600">• Tùy biến Agent Profile (Prompt, Giọng TTS)</text>
  <text x="815" y="226" fill="#f87171" font-size="11" font-weight="700">• Lệnh 'Hủy liên kết' ngắt socket tức thì &lt;= 500ms</text>

