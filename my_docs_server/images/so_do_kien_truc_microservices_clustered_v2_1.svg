  <!-- Title Banner -->
  <rect x="20" y="15" width="1120" height="75" rx="10" fill="url(#gradTitle)" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
  <text x="580" y="45" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="800" letter-spacing="0.5">HỆ THỐNG SERVER CHUẨN THƯƠNG MẠI QUẢN TRỊ 1.000 LOA XIAOZHI (PHIÊN BẢN 2.1)</text>
  <text x="580" y="68" text-anchor="middle" fill="#94a3b8" font-size="12.5">Kiến trúc Microservices Phân cụm Không trạng thái (Stateless) | AuthToken AES-GCM (1A) | Chống Spam OTA 2C | Khóa Phân tán Tuya 3A</text>

