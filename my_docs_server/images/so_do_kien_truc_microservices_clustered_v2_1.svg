  <text x="352" y="372" text-anchor="middle" fill="#64748b" font-size="9">VAD + Orchestrator</text>

  <rect x="425" y="318" width="115" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="482" y="338" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Worker 4 (8004)</text>
  <text x="482" y="356" text-anchor="middle" fill="#94a3b8" font-size="9.5">AuthToken AES-GCM</text>
  <text x="482" y="372" text-anchor="middle" fill="#64748b" font-size="9">VAD + Orchestrator</text>

  <!-- Worker features description -->
  <rect x="35" y="395" width="505" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="50" y="418" fill="#e2e8f0" font-size="11" font-weight="600">• Chuẩn hóa Token (1A): Giải mã 1 AuthToken AES-GCM duy nhất bằng server.auth_key</text>
  <text x="50" y="438" fill="#e2e8f0" font-size="11" font-weight="600">• Thu hồi liên cụm: Nhận Pub/Sub 'xiaozhi:control:revoke' ngắt socket ngay &lt;= 200ms</text>
  <text x="50" y="458" fill="#e2e8f0" font-size="11" font-weight="600">• Không trạng thái (Stateless): Không ghi file local, không xung đột .memory.yaml</text>
  <text x="50" y="478" fill="#38bdf8" font-size="11" font-weight="700">• Session Registry: Ánh xạ session:{mac} = worker_id lên Redis để định tuyến ngắt phiên</text>
  <text x="50" y="496" fill="#a7f3d0" font-size="10.5">• Điều phối phi tập trung: Chuyển dữ liệu ASR, TTS và LLM ra tầng Compute độc lập</text>

