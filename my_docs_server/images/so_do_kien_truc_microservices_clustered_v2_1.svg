  <text x="77" y="210" text-anchor="middle" fill="#10b981" font-size="9.5">Activating (2C)</text>

  <rect x="142" y="145" width="95" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="190" y="170" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">ESP32 Loa #002</text>
  <text x="190" y="190" text-anchor="middle" fill="#64748b" font-size="9.5">WiFi + Opus</text>
  <text x="190" y="210" text-anchor="middle" fill="#10b981" font-size="9.5">Activating (2C)</text>

  <rect x="255" y="145" width="95" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="302" y="170" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">ESP32 Loa #1000</text>
